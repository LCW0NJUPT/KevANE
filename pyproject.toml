[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kevane"
version = "0.3.0"
description = "Run Kev 0.6B System One decisions locally on Apple Silicon with Core ML"
requires-python = ">=3.12,<3.13"
# Dependencies are pinned in the Conda environment files.
# The pinned Kev compatibility modules are included under src/kev.
dependencies = []

[tool.setuptools]
packages = ["kevane", "kev"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
kev = ["UPSTREAM.txt"]
